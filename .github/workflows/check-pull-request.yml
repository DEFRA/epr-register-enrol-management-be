name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0
      - name: Lint (dotnet format)
        run: dotnet format style --verify-no-changes
      - name: Test with coverage
        run: dotnet test --collect:"XPlat Code Coverage" --results-directory ./coverage

      # Baseline as measured on 2026-08-18 (RA-437 branch-coverage follow-up):
      # 92.7% line / 83.6% branch. Fails the job on regression; raise as
      # coverage improves.
      - name: Enforce coverage threshold and report on PR
        if: always()
        run: |
          FILE=$(find ./coverage -name 'coverage.cobertura.xml' | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::No coverage report found — did dotnet test run?"
            exit 1
          fi
          LINE_RATE=$(grep -o 'line-rate="[0-9.]*"' "$FILE" | head -1 | grep -o '[0-9.]*')
          BRANCH_RATE=$(grep -o 'branch-rate="[0-9.]*"' "$FILE" | head -1 | grep -o '[0-9.]*')
          LINE_PCT=$(awk "BEGIN {printf \"%.2f\", $LINE_RATE*100}")
          BRANCH_PCT=$(awk "BEGIN {printf \"%.2f\", $BRANCH_RATE*100}")
          LINE_THRESHOLD=91
          BRANCH_THRESHOLD=82

          {
            echo "### Test coverage — epr-register-enrol-management-be"
            echo "| Metric | Coverage | Threshold |"
            echo "|---|---|---|"
            echo "| Line | ${LINE_PCT}% | ${LINE_THRESHOLD}% |"
            echo "| Branch | ${BRANCH_PCT}% | ${BRANCH_THRESHOLD}% |"
          } > /tmp/coverage-comment.md

          FAIL=0
          if awk "BEGIN {exit !($LINE_PCT < $LINE_THRESHOLD)}"; then
            echo "::error::Line coverage ${LINE_PCT}% is below threshold ${LINE_THRESHOLD}%"
            FAIL=1
          fi
          if awk "BEGIN {exit !($BRANCH_PCT < $BRANCH_THRESHOLD)}"; then
            echo "::error::Branch coverage ${BRANCH_PCT}% is below threshold ${BRANCH_THRESHOLD}%"
            FAIL=1
          fi
          exit $FAIL

      - name: Comment coverage on PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: /tmp/coverage-comment.md

  test-e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for matching e2e test branch
        id: e2e-branch
        run: |
          BRANCH="${{ github.head_ref }}"
          if git ls-remote --heads https://github.com/DEFRA/epr-register-enrol-mgmt-tests.git "$BRANCH" | grep -q .; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Build management-be docker image
        run: docker build -t defradigital/epr-register-enrol-management-be:${{ github.sha }} .

      - name: Check for matching management-fe branch
        id: fe-branch
        run: |
          BRANCH="${{ github.head_ref }}"
          if git ls-remote --heads https://github.com/DEFRA/epr-register-enrol-management-fe.git "$BRANCH" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout and build matching management-fe
        if: steps.fe-branch.outputs.exists == 'true'
        id: build-fe
        run: |
          git clone --branch ${{ github.head_ref }} --depth 1 https://github.com/DEFRA/epr-register-enrol-management-fe.git _fe
          cd _fe
          SHA=$(git rev-parse --short HEAD)
          docker build -t defradigital/epr-register-enrol-management-fe:$SHA .
          echo "tag=$SHA" >> "$GITHUB_OUTPUT"

      - name: Run e2e tests on ${{ steps.e2e-branch.outputs.ref }}
        uses: DEFRA/epr-register-enrol-mgmt-tests/run-journey-tests@main
        with:
          management-be: ${{ github.sha }}
          management-fe: ${{ steps.build-fe.outputs.tag }}
          branch: ${{ steps.e2e-branch.outputs.ref }}

    ## SonarCloud
    ## Uncomment to unable SonarCloud scan
    ## Requires project to be set up in SonarCloud
    ## and the SonarCloud token to be set in the repository secrets
